name: Build Linux .deb packages

on:
  push:
    branches:
      - main
    paths:
      - "main.py"
      - "config.py"
      - "modules/**"
      - "database/**"
      - "assets/**"
      - "requirements.txt"
      - "requirements-linux.txt"
      - "EventTechBarcodeManager-linux.spec"
      - "installer/linux/**"
      - "tests/**"
      - ".github/workflows/build-linux-deb.yml"
  pull_request:
    branches:
      - main
    paths:
      - "requirements-linux.txt"
      - ".github/workflows/build-linux-deb.yml"
      - "installer/linux/**"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-linux.txt
      - name: Install Linux runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            dpkg-dev \
            gnome-keyring \
            libdbus-1-3 \
            libegl1 \
            libfontconfig1 \
            libgl1 \
            libglib2.0-0 \
            libopengl0 \
            libpulse0 \
            libsecret-1-0 \
            libx11-xcb1 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-render0 \
            libxcb-shape0 \
            libxcb-shm0 \
            libxcb-sync1 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxcb-xkb1 \
            libxkbcommon-x11-0
      - name: Install legacy x86 CPU emulator
        if: matrix.arch == 'amd64'
        run: sudo apt-get install -y qemu-user
      - name: Install Python dependencies
        run: python -m pip install -r requirements-linux.txt
      - name: Smoke-test Linux dependencies
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c "from PySide6.QtWidgets import QApplication; import keyring, zxingcpp; from keyring.backends.SecretService import Keyring; print('Linux dependencies imported')"
      - name: Smoke-test amd64 dependencies without SSE4
        if: matrix.arch == 'amd64'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python_path="$(python -c 'import sys; print(sys.executable)')"
          qemu-x86_64 -cpu Penryn,-sse4.1,-sse4.2 -L / "$python_path" -c \
            "from PySide6.QtWidgets import QApplication; import keyring, zxingcpp; from keyring.backends.SecretService import Keyring; print('Linux dependencies imported on a Pentium-class CPU')"
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v
      - name: Build ${{ matrix.arch }} Debian package
        env:
          EXPECTED_DEB_ARCH: ${{ matrix.arch }}
        run: bash installer/linux/build-deb.sh
      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: eventtech-linux-${{ matrix.arch }}
          path: dist/linux/*.deb
          if-no-files-found: error
          retention-days: 30
