name: Build Raspberry Pi OS installer

on:
  push:
    branches:
      - main
    paths:
      - "main.py"
      - "config.py"
      - "modules/**"
      - "database/**"
      - "assets/**"
      - "requirements.txt"
      - "requirements-linux.txt"
      - "EventTechBarcodeManager-linux.spec"
      - "installer/linux/**"
      - "tests/**"
      - ".github/workflows/build-linux-deb.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-arm64:
    runs-on: ubuntu-22.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-linux.txt
      - name: Install Raspberry Pi OS runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            dpkg-dev \
            gnome-keyring \
            libdbus-1-3 \
            libegl1 \
            libfontconfig1 \
            libgl1 \
            libglib2.0-0 \
            libopengl0 \
            libsecret-1-0 \
            libx11-xcb1 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-render0 \
            libxcb-shape0 \
            libxcb-shm0 \
            libxcb-sync1 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxcb-xkb1 \
            libxkbcommon-x11-0
      - name: Install Python dependencies
        run: python -m pip install -r requirements-linux.txt
      - name: Smoke-test Linux dependencies
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c "from PySide6.QtWidgets import QApplication; import keyring, zxingcpp; from keyring.backends.SecretService import Keyring; print('Linux dependencies imported')"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build ARM64 Debian package
        run: bash installer/linux/build-deb.sh
      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: eventtech-raspberry-pi-os-64-bit
          path: dist/linux/*.deb
          if-no-files-found: error
          retention-days: 30
